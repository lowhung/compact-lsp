name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify vendored grammar
        run: |
          echo "fa4e01563617f1e1b5872fb81b7a835c03c553c3e5f7d4392be35b7f4d62c55b  crates/compact-analyzer/vendor/compact-tree-sitter/parser.c" | sha256sum --check
          echo "180b893c8734778fd32f372dfbc27bd6ad1cd2221f26150b31256ff6716320d2  crates/compact-analyzer/vendor/compact-tree-sitter/tree_sitter/parser.h" | sha256sum --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Install pinned Neovim
        env:
          NVIM_ARCHIVE_SHA256: b2f91117be5b5ea39edd7297156dc2a4a8df4add6c95a90809a8df19e7ab6f52
          NVIM_VERSION: 0.11.5
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --output "$RUNNER_TEMP/nvim-linux-x86_64.tar.gz" \
            "https://github.com/neovim/neovim/releases/download/v${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_ARCHIVE_SHA256}  $RUNNER_TEMP/nvim-linux-x86_64.tar.gz" | sha256sum --check
          tar --extract --gzip \
            --file "$RUNNER_TEMP/nvim-linux-x86_64.tar.gz" \
            --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Run Neovim client smoke
        env:
          COMPACT_LSP_SMOKE_ROOT: ${{ github.workspace }}/test-fixtures/client-smoke
          COMPACT_LSP_SMOKE_SERVER: ${{ github.workspace }}/target/release/compact-lsp
          NVIM_LOG_FILE: ${{ runner.temp }}/nvim.log
          XDG_STATE_HOME: ${{ runner.temp }}/nvim-state
        run: nvim --headless -i NONE -u editors/nvim/smoke.lua

      - name: Verify source packages
        run: |
          cargo package -p compact-analyzer --locked
          cargo package --workspace --locked --no-verify

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Package VSIX
        run: npm run package -- --out compact-lsp-vscode.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-lsp-vscode
          path: editors/vscode/compact-lsp-vscode.vsix
          if-no-files-found: error
