name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify release version
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "compact-lsp") | .version')"
          extension_version="$(jq -r '.version' editors/vscode/package.json)"
          test "${extension_version}" = "${package_version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "v${package_version}" = "${GITHUB_REF_NAME}"
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify vendored grammar
        run: |
          echo "fa4e01563617f1e1b5872fb81b7a835c03c553c3e5f7d4392be35b7f4d62c55b  crates/compact-analyzer/vendor/compact-tree-sitter/parser.c" | sha256sum --check
          echo "180b893c8734778fd32f372dfbc27bd6ad1cd2221f26150b31256ff6716320d2  crates/compact-analyzer/vendor/compact-tree-sitter/tree_sitter/parser.h" | sha256sum --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Verify source packages
        run: |
          cargo package -p compact-analyzer --locked
          cargo package --workspace --locked --no-verify

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: compact-lsp-linux-x86_64
            binary: compact-lsp
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: compact-lsp-macos-x86_64
            binary: compact-lsp
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: compact-lsp-macos-arm64
            binary: compact-lsp
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: compact-lsp-windows-x86_64
            binary: compact-lsp.exe
            archive: zip

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          cp README.md LICENSE LICENSE-APACHE NOTICE package/
          tar -C package -czf "${{ matrix.artifact }}.${{ matrix.archive }}" .

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          Copy-Item README.md, LICENSE, LICENSE-APACHE, NOTICE package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.${{ matrix.archive }}"

      - name: Attest release archive
        if: github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          create-storage-record: false
          subject-path: ${{ matrix.artifact }}.${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}
          if-no-files-found: error

  vscode:
    name: Package VS Code extension
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Package VSIX
        run: npm run package -- --out "compact-lsp-vscode-${GITHUB_REF_NAME}.vsix"

      - name: Attest VSIX
        if: github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          create-storage-record: false
          subject-path: editors/vscode/compact-lsp-vscode-${{ github.ref_name }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-lsp-vscode
          path: editors/vscode/compact-lsp-vscode-${{ github.ref_name }}.vsix
          if-no-files-found: error

  release:
    name: Assemble release
    needs: [build, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.vsix' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          test -s SHA256SUMS

      - name: Attest checksum manifest
        if: github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          create-storage-record: false
          subject-path: artifacts/SHA256SUMS

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Upload dry-run bundle
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-lsp-release-dry-run-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
