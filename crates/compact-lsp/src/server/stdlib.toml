# ── Optional constructors ────────────────────────────────────────────

[[circuits]]
name = "some"
type_params = "<T>"
signature = "some<T>(value: T): Maybe<T>"
snippet = "some(${1:value})"
doc = "Construct an optional container holding the given value."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[circuits]]
name = "none"
type_params = "<T>"
signature = "none<T>(): Maybe<T>"
snippet = "none()"
doc = "Construct an empty optional container."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

# ── Either constructors ──────────────────────────────────────────────

[[circuits]]
name = "left"
type_params = "<A, B>"
signature = "left<A, B>(value: A): Either<A, B>"
snippet = "left(${1:value})"
doc = "Construct the left variant of a union type."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[circuits]]
name = "right"
type_params = "<A, B>"
signature = "right<A, B>(value: B): Either<A, B>"
snippet = "right(${1:value})"
doc = "Construct the right variant of a union type."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

# ── Hash and commitment ──────────────────────────────────────────────

[[circuits]]
name = "transientHash"
type_params = "<T>"
signature = "transientHash<T>(value: T): Field"
snippet = "transientHash(${1:value})"
doc = "Circuit-efficient hash. Output is not guaranteed to be persistent across compiler versions."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[circuits]]
name = "transientCommit"
type_params = "<T>"
signature = "transientCommit<T>(value: T, rand: Field): Field"
snippet = "transientCommit(${1:value}, ${2:rand})"
doc = "Circuit-efficient commitment function. Not guaranteed persistent across compiler versions."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[circuits]]
name = "persistentHash"
type_params = "<T>"
signature = "persistentHash<T>(value: T): Bytes<32>"
snippet = "persistentHash(${1:value})"
doc = "SHA-256 hash function. Output is guaranteed persistent across compiler versions."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[circuits]]
name = "persistentCommit"
type_params = "<T>"
signature = "persistentCommit<T>(value: T, rand: Bytes<32>): Bytes<32>"
snippet = "persistentCommit(${1:value}, ${2:rand})"
doc = "SHA-256 commitment function. Output is guaranteed persistent across compiler versions."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[circuits]]
name = "degradeToTransient"
type_params = ""
signature = "degradeToTransient(x: Bytes<32>): Field"
snippet = "degradeToTransient(${1:x})"
doc = "Convert a persistent output (Bytes<32>) to a transient field element."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[circuits]]
name = "upgradeFromTransient"
type_params = ""
signature = "upgradeFromTransient(x: Field): Bytes<32>"
snippet = "upgradeFromTransient(${1:x})"
doc = "Convert a transient field element back to a persistent output (Bytes<32>)."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

