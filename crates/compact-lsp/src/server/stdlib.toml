# Compact standard library type and circuit registry.
#
# This file defines all struct types and circuit functions available via
# `import CompactStandardLibrary;`.  It is embedded at compile time
# (include_str!) and parsed once on first access.
#
# Reference: https://docs.midnight.network/develop/reference/compact/compact-std-library/exports

# ── Maybe ────────────────────────────────────────────────────────────

[[structs]]
name = "Maybe"
type_params = "<T>"
description = "Optional container that may or may not hold a value of type T."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "isSome"
type_str = "Boolean"
doc = "Whether the container holds a value."

[[structs.fields]]
name = "value"
type_str = "T"
doc = "The contained value (meaningful only when isSome is true)."

# ── Either ───────────────────────────────────────────────────────────

[[structs]]
name = "Either"
type_params = "<A, B>"
description = "Union type that holds a value of type A (left) or type B (right)."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "isLeft"
type_str = "Boolean"
doc = "Whether this holds the left variant."

[[structs.fields]]
name = "left"
type_str = "A"
doc = "The left variant value (meaningful only when isLeft is true)."

[[structs.fields]]
name = "right"
type_str = "B"
doc = "The right variant value (meaningful only when isLeft is false)."

# ── CurvePoint ───────────────────────────────────────────────────────

[[structs]]
name = "CurvePoint"
type_params = ""
description = "A point on the elliptic curve used for cryptographic operations."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "x"
type_str = "Field"
doc = "The x-coordinate of the curve point."

[[structs.fields]]
name = "y"
type_str = "Field"
doc = "The y-coordinate of the curve point."

# ── MerkleTreeDigest ─────────────────────────────────────────────────

[[structs]]
name = "MerkleTreeDigest"
type_params = ""
description = "Merkle tree root digest used with `checkRoot()` for membership verification."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "field"
type_str = "Field"
doc = "The digest value as a field element."

# ── MerkleTreePathEntry ──────────────────────────────────────────────

[[structs]]
name = "MerkleTreePathEntry"
type_params = ""
description = "A single entry in a Merkle tree path proof."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "sibling"
type_str = "MerkleTreeDigest"
doc = "The sibling digest at this level of the tree."

[[structs.fields]]
name = "goesLeft"
type_str = "Boolean"
doc = "Whether this node is the left child at this level."

# ── MerkleTreePath ───────────────────────────────────────────────────

[[structs]]
name = "MerkleTreePath"
type_params = "<#n, T>"
description = "A Merkle tree inclusion proof containing the leaf and path entries."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "leaf"
type_str = "T"
doc = "The leaf value being proven."

[[structs.fields]]
name = "path"
type_str = "Vector<n, MerkleTreePathEntry>"
doc = "The path from the leaf to the root."

# ── ContractAddress ──────────────────────────────────────────────────

[[structs]]
name = "ContractAddress"
type_params = ""
description = "Contract address type returned by `kernel.self()`."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "bytes"
type_str = "Bytes<32>"
doc = "The raw 32-byte contract address."

# ── CoinInfo ─────────────────────────────────────────────────────────

[[structs]]
name = "CoinInfo"
type_params = ""
description = "Coin information type for token operations."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "nonce"
type_str = "Bytes<32>"
doc = "Unique nonce for the coin."

[[structs.fields]]
name = "color"
type_str = "Bytes<32>"
doc = "Token type identifier (color)."

[[structs.fields]]
name = "value"
type_str = "Uint<128>"
doc = "The coin value (amount)."

# ── QualifiedCoinInfo ────────────────────────────────────────────────

[[structs]]
name = "QualifiedCoinInfo"
type_params = ""
description = "Coin information with a Merkle tree index, representing a coin stored in the ledger."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "nonce"
type_str = "Bytes<32>"
doc = "Unique nonce for the coin."

[[structs.fields]]
name = "color"
type_str = "Bytes<32>"
doc = "Token type identifier (color)."

[[structs.fields]]
name = "value"
type_str = "Uint<128>"
doc = "The coin value (amount)."

[[structs.fields]]
name = "mtIndex"
type_str = "Uint<64>"
doc = "Index of the coin in the Merkle tree."

# ── ZswapCoinPublicKey ───────────────────────────────────────────────

[[structs]]
name = "ZswapCoinPublicKey"
type_params = ""
description = "Public key for Zswap coin operations, identifying a coin recipient."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "bytes"
type_str = "Bytes<32>"
doc = "The raw 32-byte public key."

# ── SendResult ───────────────────────────────────────────────────────

[[structs]]
name = "SendResult"
type_params = ""
description = "Result of a send operation, containing change and the sent coin."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "change"
type_str = "Maybe<CoinInfo>"
doc = "Change coin returned to the sender, if any."

[[structs.fields]]
name = "sent"
type_str = "CoinInfo"
doc = "The coin that was sent to the recipient."

